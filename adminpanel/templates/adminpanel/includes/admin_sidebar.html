<!-- ========================================================================
   Shared VERDÉ Admin Sidebar Navigation Component
   ======================================================================== -->
<aside class="admin-sidebar" aria-label="Admin Navigation">
    <style>
        .admin-sidebar .sidebar-brand-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            text-decoration: none;
            color: inherit;
        }
        .admin-sidebar .sidebar-brand-icon {
            width: 24px;
            height: 24px;
            stroke: #a2c4ac;
            margin-bottom: 2px;
        }
    </style>

    <!-- Brand Header -->
    <div class="sidebar-brand">
        <a href="{% url 'admin_dashboard_page' %}" class="sidebar-brand-wrap" title="VERDÉ Admin Dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" class="sidebar-brand-icon">
                <path d="M12 2L12 22"></path>
                <path d="M12 7C14.5 4.5 18 5 19 6C20 7 20.5 10.5 18 13C15.5 15.5 12 15 12 15"></path>
                <path d="M12 12C9.5 9.5 6 10 5 11C4 12 3.5 15.5 6 18C8.5 20.5 12 20 12 20"></path>
                <circle cx="12" cy="3" r="1.5" fill="currentColor"></circle>
            </svg>
            <div class="brand-title">VERDÉ</div>
            <div class="brand-subtitle">ADMIN</div>
        </a>
    </div>

    <!-- Section: Overview -->
    <div class="nav-section">
        <div class="nav-section-title">OVERVIEW</div>
        <ul class="nav-list">
            <li class="nav-item {% if active_menu == 'dashboard' %}active{% endif %}">
                <a href="{% url 'admin_dashboard_page' %}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    <span>Dashboard</span>
                </a>
            </li>
        </ul>
    </div>

    <!-- Section: Catalog -->
    <div class="nav-section">
        <div class="nav-section-title">CATALOG</div>
        <ul class="nav-list">
            <li class="nav-item {% if active_menu == 'products' %}active{% endif %}">
                <a href="{% url 'product_dashboard' %}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                        <line x1="12" y1="22.08" x2="12" y2="12"></line>
                    </svg>
                    <span>Products</span>
                </a>
            </li>
            <li class="nav-item {% if active_menu == 'categories' %}active{% endif %}">
                <a href="{% url 'category_dashboard' %}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 17 12 22 22 17"></polyline>
                        <polyline points="2 12 12 17 22 12"></polyline>
                    </svg>
                    <span>Categories</span>
                </a>
            </li>
        </ul>
    </div>

    <!-- Section: Sales -->
    <div class="nav-section">
        <div class="nav-section-title">SALES</div>
        <ul class="nav-list">
            <li class="nav-item {% if active_menu == 'orders' %}active{% endif %}">
                <a href="{% url 'orders:admin_order_list' %}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <path d="M16 10a4 4 0 0 1-8 0"></path>
                    </svg>
                    <span>Orders</span>
                </a>
            </li>
            <li class="nav-item {% if active_menu == 'coupons' %}active{% endif %}">
                <a href="{% url 'admin_coupons_page' %}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
                        <line x1="7" y1="7" x2="7.01" y2="7"></line>
                    </svg>
                    <span>Coupons</span>
                </a>
            </li>
        </ul>
    </div>

    <!-- Section: Customers -->
    <div class="nav-section">
        <div class="nav-section-title">CUSTOMERS</div>
        <ul class="nav-list">
            <li class="nav-item {% if active_menu == 'users' %}active{% endif %}">
                <a href="{% url 'admin_users_page' %}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    <span>Users</span>
                </a>
            </li>
            <li class="nav-item {% if active_menu == 'referrals' %}active{% endif %}">
                <a href="{% url 'referrals:admin_referrals_page' %}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="18" cy="5" r="3"></circle>
                        <circle cx="6" cy="12" r="3"></circle>
                        <circle cx="18" cy="19" r="3"></circle>
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                    </svg>
                    <span>Referrals</span>
                </a>
            </li>
        </ul>
    </div>

    <!-- Section: Analytics -->
    <div class="nav-section">
        <div class="nav-section-title">ANALYTICS</div>
        <ul class="nav-list">
            <li class="nav-item {% if active_menu == 'sales_report' or active_menu == 'analytics' %}active{% endif %}">
                <a href="{% url 'sales_reports:sales_report' %}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="20" x2="18" y2="10"></line>
                        <line x1="12" y1="20" x2="12" y2="4"></line>
                        <line x1="6" y1="20" x2="6" y2="14"></line>
                    </svg>
                    <span>Sales &amp; Revenue</span>
                </a>
            </li>
        </ul>
    </div>

    <!-- Section: System -->
    <div class="nav-section">
        <div class="nav-section-title">SYSTEM</div>
        <ul class="nav-list">
            <li class="nav-item {% if active_menu == 'settings' %}active{% endif %}">
                <a href="{% url 'admin_settings:admin_settings' %}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    <span>Settings</span>
                </a>
            </li>
        </ul>
    </div>
</aside>
