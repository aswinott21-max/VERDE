<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERDÉ - Reset Password</title>
</head>
<body>

    <h1>Reset Password</h1>

    <p>Enter the OTP sent to your email.</p>

    <!-- Form for entering the password reset OTP -->
    <form id="resetOtpForm">

        <label for="otp">OTP</label>
        <input type="text" id="otp" maxlength="6" required>

        <br><br>

        <button type="submit">Verify OTP</button>

    </form>
    <script>
    // Handle password reset OTP verification
    document.getElementById("resetOtpForm").addEventListener("submit", async function(event) {

        // Prevent the page from refreshing
        event.preventDefault();

        // Get the OTP entered by the user
        const otp = document.getElementById("otp").value;

        // Send the OTP to the Django verification API
        const response = await fetch("/reset-password/verify-otp/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                otp: otp
            })
        });

        // Convert the response into JSON
        const result = await response.json();

        // Handle the verification result
        if (response.ok) {
        // OTP is verified, so move to the new password page
            alert(result.message);
            window.location.href = "/reset-password/";
        } else {
            // Show the error message
            alert(result.error);
        }
    });
    </script>

</body>
</html>
