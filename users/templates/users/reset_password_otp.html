{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VERDÉ | Verify Your Code</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body class="otp-page">
    <header class="otp-header">
      <a href="/" class="otp-brand" aria-label="VERDÉ home">
        <span class="otp-brand-mark">✣</span><span>VERDÉ</span>
      </a>
    </header>

    <main class="otp-main">
      <section class="otp-card" aria-labelledby="otp-title">
        <div class="otp-icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 21V10"></path>
            <path d="M12 14c-3.5-1.2-5-3.8-4.4-6.5 3 .1 5 1.8 4.4 6.5Z"></path>
            <path d="M12 17c3.5-1.2 5-3.8 4.4-6.5-3 .1-5 1.8-4.4 6.5Z"></path>
          </svg>
        </div>
        <h1 id="otp-title">Verify Your Code</h1>
        <p class="otp-description">
          Enter the six-digit code we sent to your email to continue resetting
          your password.
        </p>

        <form class="otp-form" id="resetOtpForm">
          <div class="otp-field">
            <label for="otp">Verification Code</label>
            <input
              type="text"
              id="otp"
              name="otp"
              inputmode="numeric"
              pattern="[0-9]{6}"
              maxlength="6"
              placeholder="000000"
              autocomplete="one-time-code"
              required
            />
            <span
              class="field-error"
              id="otpFieldError"
              role="alert"
              aria-live="polite"
            ></span>
          </div>
          <p class="otp-timer" id="otpTimer" role="status">
            Code expires in 01:00
          </p>
          <p
            class="otp-error"
            id="otpError"
            role="alert"
            aria-live="polite"
          ></p>
          <button class="otp-submit" type="submit">
            Verify Code <span aria-hidden="true">→</span>
          </button>
          <button class="otp-resend" id="resendBtn" type="button" disabled>
            Resend OTP
          </button>
        </form>

        <a class="otp-back" href="/forgot-password/"
          >← &nbsp;Back to Forgot Password</a
        >
      </section>
    </main>

    <footer class="otp-footer">
      © 2024 VERDÉ Botanical. All rights reserved.
    </footer>

    <script>
      const otpForm = document.getElementById("resetOtpForm");
      const otpInput = document.getElementById("otp");
      const otpFieldError = document.getElementById("otpFieldError");
      const otpTimer = document.getElementById("otpTimer");
      const otpError = document.getElementById("otpError");
      const resendButton = document.getElementById("resendBtn");
      let timeLeft = 60;
      let countdown;

      function clearFieldError() {
        if (otpFieldError) otpFieldError.textContent = "";
        if (otpInput) otpInput.classList.remove("is-invalid");
      }

      function setFieldError(msg) {
        if (otpFieldError) otpFieldError.textContent = msg;
        if (otpInput) otpInput.classList.add("is-invalid");
      }

      otpInput.addEventListener("input", function () {
        otpInput.value = otpInput.value.replace(/\D/g, "").slice(0, 6);
        clearFieldError();
        if (otpError) {
          otpError.textContent = "";
          otpError.style.color = "";
        }
      });

      function startTimer() {
        clearInterval(countdown);
        timeLeft = 60;
        resendButton.disabled = true;
        otpTimer.classList.remove("expired");
        clearFieldError();

        countdown = setInterval(function () {
          const minutes = String(Math.floor(timeLeft / 60)).padStart(2, "0");
          const seconds = String(timeLeft % 60).padStart(2, "0");
          otpTimer.textContent = `Code expires in ${minutes}:${seconds}`;
          timeLeft -= 1;

          if (timeLeft < 0) {
            clearInterval(countdown);
            otpTimer.textContent = "Code expires in 00:00 (Expired)";
            otpTimer.classList.add("expired");
            resendButton.disabled = false;
          }
        }, 1000);
      }

      otpForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        clearFieldError();
        if (otpError) {
          otpError.textContent = "";
          otpError.style.color = "";
        }

        const otpVal = otpInput.value.trim();
        if (otpVal.length !== 6) {
          setFieldError("Enter all six digits of your verification code.");
          otpInput.focus();
          return;
        }

        try {
          const response = await fetch("/reset-password/verify-otp/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ otp: otpVal }),
          });
          const result = await response.json();

          if (response.ok) {
            // Replace the OTP page in browser history
            window.location.replace("/reset-password/");
          } else {
            setFieldError(result.error || "Unable to verify the code.");
            otpInput.focus();
          }
        } catch (error) {
          setFieldError("Unable to connect. Please try again.");
        }
      });

      resendButton.addEventListener("click", async function () {
        clearFieldError();
        if (otpError) {
          otpError.textContent = "";
          otpError.style.color = "";
        }

        const email = sessionStorage.getItem("reset_password_email") || "";

        try {
          const response = await fetch("/forgot-password/send-otp/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: email }),
          });
          const result = await response.json();

          if (response.ok) {
            otpError.style.color = "var(--color-accent, #2e593d)";
            otpError.textContent =
              result.message || "A new code has been sent to your email.";
            startTimer();
          } else {
            setFieldError(
              result.error || "Unable to resend OTP. Please try again.",
            );
          }
        } catch (error) {
          setFieldError("Unable to connect. Please try again.");
        }
      });

      startTimer();

      // Handle pages restored from browser history
      window.addEventListener("pageshow", function () {
        fetch("/reset-password-otp/", {
          method: "GET",
          cache: "no-store",
        }).then(function (response) {
          if (response.redirected) {
            // Reset flow is no longer valid, so leave this old page
            window.location.replace(response.url);
          }
        });
      });
    </script>
  </body>
</html>
