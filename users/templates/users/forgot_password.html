{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VERDÉ | Forgot Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body class="forgot-page">
    <header class="forgot-header">
      <a href="/" class="forgot-brand" aria-label="VERDÉ home">
        <span class="forgot-brand-mark">✣</span><span>VERDÉ</span>
      </a>
    </header>

    <main class="forgot-main">
      <section class="forgot-card" aria-labelledby="forgot-title">
        <div class="forgot-icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 21V10"></path>
            <path d="M12 14c-3.5-1.2-5-3.8-4.4-6.5 3 .1 5 1.8 4.4 6.5Z"></path>
            <path d="M12 17c3.5-1.2 5-3.8 4.4-6.5-3 .1-5 1.8-4.4 6.5Z"></path>
          </svg>
        </div>
        <h1 id="forgot-title">Forgot Your Password?</h1>
        <p class="forgot-description">
          No worries. Enter the email address associated with your account and
          we'll send you a top to reset your password.
        </p>

        <form class="forgot-form" id="forgotPasswordForm">
          <div class="forgot-field">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="hello@example.com"
              autocomplete="email"
              required
            />
            <span class="field-error" id="emailError" role="alert" aria-live="polite"></span>
          </div>
          <p
            class="forgot-error"
            id="forgotError"
            role="alert"
            aria-live="polite"
          ></p>
          <button class="forgot-submit" type="submit">
            Send OTP <span aria-hidden="true">→</span>
          </button>
        </form>

        <a class="forgot-back" href="/login-page/">← &nbsp;Back to Sign In</a>
      </section>
    </main>

    <footer class="forgot-footer">
      © 2024 VERDÉ Botanical. All rights reserved.
    </footer>

    <script>
      const forgotForm = document.getElementById("forgotPasswordForm");
      const emailInput = document.getElementById("email");
      const emailError = document.getElementById("emailError");
      const forgotError = document.getElementById("forgotError");

      function clearFieldError() {
        if (emailError) emailError.textContent = "";
        if (emailInput) emailInput.classList.remove("is-invalid");
        if (forgotError) forgotError.textContent = "";
      }

      function setFieldError(msg) {
        if (emailError) emailError.textContent = msg;
        if (emailInput) emailInput.classList.add("is-invalid");
      }

      emailInput.addEventListener("input", clearFieldError);

      forgotForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        clearFieldError();

        const emailVal = emailInput.value.trim();
        if (!emailVal) {
          setFieldError("Email address is required.");
          emailInput.focus();
          return;
        }

        try {
          const response = await fetch("/forgot-password/send-otp/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: emailVal,
            }),
          });
          const result = await response.json();

          if (response.ok) {
            sessionStorage.setItem("reset_password_email", emailVal);
            window.location.href = "/reset-password-otp/";
          } else {
            const err = result.error || "Unable to send OTP.";
            const lowerErr = err.toLowerCase();
            if (lowerErr.includes("email") || lowerErr.includes("verify your email")) {
              setFieldError(err);
              emailInput.focus();
            } else {
              forgotError.textContent = err;
            }
          }
        } catch (error) {
          forgotError.textContent = "Unable to connect. Please try again.";
        }
      });
    </script>
  </body>
</html>
