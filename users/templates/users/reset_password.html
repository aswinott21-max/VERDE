<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERDÉ - Reset Password</title>
</head>
<body>

    <h1>Set New Password</h1>

    <!-- Form for entering the new password -->
    <form id="resetPasswordForm">

        <label for="password">New Password</label>
        <input type="password" id="password" required>

        <br><br>

        <label for="confirm_password">Confirm New Password</label>
        <input type="password" id="confirm_password" required>

        <br><br>

        <button type="submit">Reset Password</button>

    </form>
    <script>
        // Handle the new password form submission
        document.getElementById("resetPasswordForm").addEventListener("submit", async function(event) {
            // Confirm that the form submission JavaScript is running
            console.log("Reset password form submitted");

            // Prevent the page from refreshing
            event.preventDefault();

            // Get the new password values
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm_password").value;

            // Temporary debugging: check the values before sending them
            console.log("Password:", password);
            console.log("Confirm Password:", confirmPassword);

            // Send the new password to Django
            const response = await fetch("/reset-password/change/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    password: password,
                    confirm_password: confirmPassword
                })
            });

            // Convert the response into JSON
            const result = await response.json();

            // Handle the reset password response
            if (response.ok) {
                alert(result.message);

                // Go to the login page after successful password reset
                window.location.href = "/login-page/";
            } else {
                alert(result.error);
            }
        });
    </script>

</body>
</html>
